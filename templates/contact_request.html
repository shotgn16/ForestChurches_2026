<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Request</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat" rel="stylesheet" type="text/css">
    <style type="text/css">
        body {
            font-family: 'Montserrat', 'Trebuchet MS', 'Lucida Grande', 'Lucida Sans Unicode', 'Lucida Sans', Tahoma, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 20px;
        }

        .content {
            color: #555555;
            line-height: 1.8;
        }

        .footer {
            text-align: center;
            color: #a8bf6f;
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="logo">
            <!-- IMGUR-2 -->
            <img src="{IMAGE-2}" alt="ForestChurches Logo" width="200">
        </div>
        <div class="content">
            <p>Hello <span style="color:#00ac64;">{username}</span>,</p>
            <p>{paragraph}</p>
			<p>Thanks,</p>
			<p><em>{admin_name}</em> | Forest Church Administration Team.</p>
			<p style="font-size: x-small; text-align: center;"></p>
        </div>
        <div class="footer">
            <p style="font-size: x-small; text-align: center; color:black;">If you have any issues, please let us know at <span style="color:#00ac64;font-size: x-small;text-align: center;font-weight:bold;">info@forestchurches.co.uk</span></p>
        </div>
    </div>
</body>

</html>
