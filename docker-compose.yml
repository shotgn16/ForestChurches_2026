version: "3.8"

services:
  forestchurches:
    build:
      context: .
      dockerfile: Dockerfile
    image: forestchurches:local
    ports:
      - "8080:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - EMAILMANAGEMENT__BASEURL=http://emailmanagement:80
    depends_on:
      - emailmanagement

  emailmanagement:
    build:
      context: "./EmailManagement-ForestChurches (19.10.2025)"
      dockerfile: Dockerfile
    image: emailmanagement:local
    ports:
      - "8081:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - FORESTCHURCHES__BASEURL=http://forestchurches:80

networks:
  default:
    driver: bridge
